# Dedicated Debian trixie VPP+DPDK lane configuration.
# Bind the selected BDF to vfio-pci before using this file.
unix {
  nodaemon
  log /var/log/vpp/vpp-dpdk.log
  cli-listen /run/vpp/dpdk-cli.sock
  api-segment { prefix /vpp-dpdk }
}
statseg { socket-name /run/vpp/dpdk-stats.sock }
plugins { plugin dpdk_plugin.so { enable } }
dpdk {
  dev 0000:04:00.0
}
