name: Interop Gate

# External-client verification: gnmic (independent grpc-go
# implementation) against the hand-written C gNMI/gRPC stack.
# Runs on every push/PR so interop breakage is caught at the gate.

on:
  push:
    branches: [main, v0.1]
  pull_request:
    branches: [main]

jobs:
  gnmic-interop:
    name: gnmic interop (I1-I9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake socat
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build gnmic
        run: |
          mkdir -p /tmp/gnmic-build && cd /tmp/gnmic-build
          go mod init build
          go get github.com/openconfig/gnmic@v0.35.0
          go build -o /usr/local/bin/gnmic github.com/openconfig/gnmic
          gnmic version
      - name: Configure & build DANOS
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Run interop verification (I1-I9)
        run: |
          export GNMIC=/usr/local/bin/gnmic
          bash danos-test/integration/run_v0.4_interop.sh

  sanitizers:
    name: ASAN + UBSAN (full suite + fuzz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Configure (ASAN+UBSAN)
        run: cmake -B build-asan -DDANOS_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-asan -j$(nproc)
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure
      - name: Decoder fuzzing under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./build-asan/danos-test/fuzz_decoders

  concurrent-scale:
    name: Scale (32 concurrent gNMI connections)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Concurrent connections
        run: ctest --test-dir build -R concurrent_conns --output-on-failure

  oci-image:
    name: mgrd OCI image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc) --target danos-mgrd
      - name: Build OCI image
        run: docker build -f danos-build/Dockerfile.mgrd -t danos-mgrd:${{ github.sha }} .
      - name: Smoke test image
        run: |
          docker run -d --name mgrd-smoke danos-mgrd:${{ github.sha }} \
            --port 59200 --metrics-port 59201 --wal /tmp/smoke.wal --seed
          sleep 2
          curl -sf http://127.0.0.1:59201/metrics | grep -q danos_ \
            && echo "metrics OK"
          docker logs mgrd-smoke | grep -q "gNMI" && echo "gNMI OK"
          docker rm -f mgrd-smoke

  kernel-programming:
    name: Kernel programming (K4/K5-ping)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake iproute2
      - name: Setup Go (gnmic)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build gnmic
        run: |
          mkdir -p /tmp/gnmic-build && cd /tmp/gnmic-build
          go mod init build
          go get github.com/openconfig/gnmic@v0.35.0
          go build -o /usr/local/bin/gnmic github.com/openconfig/gnmic
      - name: Build DANOS
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc) --target danos-mgrd --target programming_pipeline_test
      - name: K4/K5 verification (root runner: real netns + ping)
        run: sudo -E env PATH="$PATH" bash danos-test/integration/run_v0.10_kernel.sh

  vpp-interop:
    name: VPP interop (V1-V5)
    runs-on: ubuntu-24.04
    continue-on-error: true   # VPP packaging/version drift: report, don't block (until stable)
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake socat
      - name: Install VPP (FDio)
        run: |
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://packagecloud.io/fdio/release/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/fdio.gpg
          echo "deb [signed-by=/usr/share/keyrings/fdio.gpg] https://packagecloud.io/fdio/release/ubuntu noble main" | sudo tee /etc/apt/sources.list.d/fdio.list
          sudo apt-get update
          sudo apt-get install -y vpp vpp-plugin-core vpp-plugin-dpdk || sudo apt-get install -y vpp vpp-plugin-core
      - name: Record installed versions -> job summary
        if: always()
        run: |
          {
            echo "## Platform baseline (installed on this runner)"
            echo ""
            echo "| Component | Version |"
            echo "|-----------|---------|"
            echo "| Debian | $(cat /etc/debian_version) |"
            echo "| Kernel | $(uname -r) |"
            echo "| VPP | $(dpkg -l vpp 2>/dev/null | awk '/^ii/{print $3}' || echo 'not installed') |"
            echo "| vpp-plugin-core | $(dpkg -l vpp-plugin-core 2>/dev/null | awk '/^ii/{print $3}' || echo '-') |"
            echo "| DPDK (via vpp) | $(dpkg -l | awk '/libdpdk|dpdk/{print $3; exit}' || echo 'bundled') |"
            echo "| FRR | (not used in this job) |"
            echo "| P4 | n/a |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Also echo for log scraping / matrix backfill:
          echo "VPP_VERSION=$(dpkg -l vpp 2>/dev/null | awk '/^ii/{print $3}')" >> "$GITHUB_ENV"
      - name: Configure VPP (api socket + stat segment)
        run: |
          sudo mkdir -p /run/vpp /etc/vpp
          sudo tee /etc/vpp/startup.conf > /dev/null <<'VPPCFG'
          unix { nodaemon log /tmp/vpp.log }
          api-segment { prefix danos }
          socksvr { socket-name /run/vpp/api.sock }
          statseg { socket-name /run/vpp/stats.sock }
          VPPCFG
      - name: Start VPP
        run: |
          sudo vpp -c /etc/vpp/startup.conf > /tmp/vpp-stdout.log 2>&1 &
          sleep 5
          ls -la /run/vpp/api.sock /run/vpp/stats.sock
      - name: Setup Go (gnmic)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build gnmic
        run: |
          mkdir -p /tmp/gnmic-build && cd /tmp/gnmic-build
          go mod init build
          go get github.com/openconfig/gnmic@v0.35.0
          go build -o /usr/local/bin/gnmic github.com/openconfig/gnmic
      - name: Build DANOS
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: V1-V5 verification against real VPP
        env:
          GNMIC: /usr/local/bin/gnmic
        run: |
          export VPP_API_SOCK=/run/vpp/api.sock
          sudo -E env PATH="$PATH" GNMIC="$GNMIC" VPP_API_SOCK="$VPP_API_SOCK" \
            bash danos-test/integration/run_v0.4_interop.sh --with-vpp || true
          # V-group is informational until version-drift handling stabilizes
